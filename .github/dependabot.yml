version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot proposes updates
  # (new SHA + version comment) as reviewable pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images are pinned by digest (tag kept for readability); Dependabot
  # proposes a new digest when the tag is rebuilt upstream (security patches).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

name: CI
on:
  push:
  pull_request:

# Least privilege: no job needs to write to the repository.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
      # SHA-256 of gitleaks_8.24.3_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      # Scans the full history on every run, so the first push of a branch is
      # covered too (the range-based action failed when the base had no parent).
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hub_test:hub_test_password@127.0.0.1:5432/hub_test
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test_password
          POSTGRES_DB: hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub_test -d hub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn audit
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:integration
      - run: yarn build

name: CI
on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hub_test:hub_test_password@127.0.0.1:5432/hub_test
      REDIS_URL: redis://127.0.0.1:6379
      WEBHOOK_SECRET: ci-only-webhook-secret-more-than-32-characters
      ADMIN_API_TOKEN: ci-only-admin-token-more-than-32-characters
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test_password
          POSTGRES_DB: hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub_test -d hub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn audit
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:integration
      - run: yarn build

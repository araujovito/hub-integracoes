# Scrapes the API's /metrics (bearer token) and evaluates the alert rules.
# No Alertmanager is configured: who gets paged, and how, is an operational
# decision. Firing alerts are visible at http://127.0.0.1:9090/alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hub-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:3000"]

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hub_integracoes}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub_dev} -d ${POSTGRES_DB:-hub_integracoes}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-hub_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hub_integracoes}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-integration:orders}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-erp-simulator}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?Set PLATFORM_ADMIN_TOKEN in .env}
      TENANT_SECRETS_KEY: ${TENANT_SECRETS_KEY:?Set TENANT_SECRETS_KEY in .env}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-96}
      OPENAI_DAILY_TOKEN_LIMIT: ${OPENAI_DAILY_TOKEN_LIMIT:-5000}
      OPENAI_RESERVED_INPUT_TOKENS: ${OPENAI_RESERVED_INPUT_TOKENS:-256}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5

  relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/outbox-relay.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-hub_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hub_integracoes}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-integration:orders}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-erp-simulator}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const { Client } = require('pg'); const Redis = require('ioredis'); const p = new Client({ connectionString: process.env.DATABASE_URL }); const r = new Redis(process.env.REDIS_URL); Promise.all([p.connect().then(()=>p.query('SELECT 1')).finally(()=>p.end()), r.ping().finally(()=>r.quit())]).then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 6s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-hub_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hub_integracoes}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-integration:orders}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-erp-simulator}
      WORKER_CONSUMER: ${WORKER_CONSUMER:-worker}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_CLAIM_IDLE_MS: ${WORKER_CLAIM_IDLE_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const { Client } = require('pg'); const Redis = require('ioredis'); const p = new Client({ connectionString: process.env.DATABASE_URL }); const r = new Redis(process.env.REDIS_URL); Promise.all([p.connect().then(()=>p.query('SELECT 1')).finally(()=>p.end()), r.ping().finally(()=>r.quit())]).then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 6s
      retries: 5

  maintenance:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/maintenance-runner.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-hub_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hub_integracoes}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-integration:orders}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-erp-simulator}
      STREAM_RETENTION_HOURS: ${STREAM_RETENTION_HOURS:-72}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
